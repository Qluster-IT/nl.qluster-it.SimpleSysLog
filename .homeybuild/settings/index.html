<style>

</style>

<body class="index h-100 overflow-hidden">
	<div ng-app="simplelog" ng-controller="simplelogCtrl as simplelog" class="main-view overflow-hidden" ng-class="{rotated90:view.settings.rotated90}">
		<div class="d-flex flex-column overflow-hidden h-100">
			<div class="container text-center">
				<div class="row">
					<div class="col"><span class="fa-solid toggle-icon fa-rotate-right" ng-click="toggleSetting('rotated90');"></span></div>
				</div>
			</div>
			<div class="flex-grow-1 overflow-y-auto">
				<div ui-grid="logGridOptions" class="log-grid" ui-grid-auto-resize ui-grid-resize-columns ui-grid-selection ui-grid-pagination></div>

				<!-- <table class="log-table">
					<thead>
						<tr>
							<th>Timestamp</th>
							<th>Severity</th>
							<th>Facility</th>
							<th>App</th>
							<th>Message</th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="log in vars.logs">
							<td>{{log.timestamp}}</td>
							<td>{{log.severity}}</td>
							<td>{{log.facility}}</td>
							<td>{{log.app}}</td>
							<td>{{log.message}}</td>
						</tr>
					</tbody>
				</table> -->
			</div>
			<!-- <div uib-pagination total-items="vars.logTotal" ng-model="vars.logCurrentPage" items-per-page="vars.logPerPage"></div> -->
		</div>
		<div id="overlay"></div>
		<script>
			function onHomeyReady(Homey) {
				Homey.ready();
				var scope = angular.element(document.getElementById('overlay')).scope();
				scope.$apply(function () {
					scope.simplelog.init(Homey, scope);
				});
			}
		</script>
	</div>
</body>

</html>
